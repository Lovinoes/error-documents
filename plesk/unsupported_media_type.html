<!DOCTYPE html>
<html lang="en">
<head>
    <title>[415 Unsupported Media Type]</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="[415 Unsupported Media Type]">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="language" content="en">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light only">
    <meta name="darkreader-lock">
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
    <link rel="stylesheet" href="https://fonts.bunny.net/css2?family=Chakra+Petch:wght@400;500;700&display=swap">
    <style>
        ::selection { background:#fff; color:#000; }

        body {
            margin:0; min-height:100vh; background:#0a0a0a;
            font-family:'Chakra Petch',sans-serif; color:#fff; cursor:default;
            display:flex; align-items:center; justify-content:center;
            padding:24px; box-sizing:border-box;
        }

        .container { max-width:600px; width:100%; text-align:left; }

        h1 { margin:0 0 12px; font-size:2rem; font-weight:700; }
        p  { margin:0 0 20px; color:#ccc; }

        .links-container { display:flex; gap:15px; justify-content:flex-start; flex-wrap:wrap; }
        .link-btn {
            padding:12px 24px; border:1px solid #fff; background:transparent; color:#fff;
            text-transform:uppercase; letter-spacing:.05em; text-decoration:none;
            box-shadow:0 0 8px rgba(255,255,255,.4); transition:.25s;
            -webkit-user-drag:none; font-family:inherit; font-size:1rem; cursor:pointer;
        }
        .link-btn:hover { box-shadow:0 0 12px rgba(255,255,255,.5); transform:translateY(-2px); }

        @media (max-width:760px) {
            h1 { font-size:1.6rem; }
            .link-btn { padding:10px 18px; font-size:.9rem; }
        }
    </style>
    <script>
        document.addEventListener('contextmenu', function(e) {
            if (e.target.closest('a, button')) return;
            e.preventDefault();
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>415 Unsupported Media Type</h1>
        <p>The Web server cannot service the request because the requested file is in a format that the server is configured not to download.</p>
        <div class="links-container">
            <a href="/" class="link-btn">Home</a>
            <button type="button" class="link-btn" onclick="location.reload()">Reload</button>
            <button type="button" class="link-btn" onclick="history.back()">Go Back</button>
        </div>
    </div>
</body>
</html>
